version: '3.8'

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: rag_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag_chatbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rag_network

  backend:
    build: .
    container_name: rag_backend
    env_file:
      - .env
    environment:
      # Override the DB host to point to the docker network service 'db'
      POSTGRES_HOST: db
      DATABASE_URL: postgresql://postgres:postgres@db:5432/rag_chatbot
    ports:
      - "8000:8000"
    depends_on:
      - db
    networks:
      - rag_network

  frontend:
    build: ./frontend
    container_name: rag_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - rag_network

networks:
  rag_network:
    driver: bridge

volumes:
  postgres_data:
